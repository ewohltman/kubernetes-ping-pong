---
apiVersion: v1
kind: Service
metadata:
  name: ping
  labels:
    app: ping
    service: ping
spec:
  ports:
    - name: http
      port: 8080
  selector:
    app: ping
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ping
  labels:
    account: ping
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping
  labels:
    app: ping
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping
      version: v1
  template:
    metadata:
      labels:
        app: ping
        version: v1
    spec:
      serviceAccountName: ping
      containers:
        - name: ping
          image: ewohltman/ping:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
